<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Product image not set yet">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2e9"/>
      <stop offset="0.55" stop-color="#ece9dc"/>
      <stop offset="1" stop-color="#e2e0d1"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3cdbe"/>
      <stop offset="1" stop-color="#b4c0ae"/>

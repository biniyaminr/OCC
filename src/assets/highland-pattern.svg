<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" width="1440" height="420" preserveAspectRatio="none" aria-hidden="true">
  <!--
    Decorative contour lines echoing Ethiopia's highland terracing.
    Transparent background so it can wash over any section colour.
  -->
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="softEdge">
      <rect width="1440" height="420" fill="url(#fade)"/>
    </mask>
  </defs>

  <g mask="url(#softEdge)" fill="none" stroke="#1d4a2c" stroke-width="1.6" stroke-linecap="round">
    <path d="M-40 60 C 180 6 340 104 540 76 C 760 44 900 128 1120 96 C 1280 72 1380 110 1480 88" opacity="0.30"/>
    <path d="M-40 104 C 190 48 350 148 550 118 C 770 86 910 170 1130 138 C 1290 114 1385 152 1480 130" opacity="0.27"/>
    <path d="M-40 148 C 200 92 360 190 560 160 C 780 128 920 212 1140 180 C 1300 156 1390 194 1480 172" opacity="0.24"/>
    <path d="M-40 192 C 210 136 370 234 570 204 C 790 172 930 254 1150 222 C 1310 198 1395 236 1480 214" opacity="0.21"/>
    <path d="M-40 236 C 220 180 380 278 580 248 C 800 216 940 296 1160 264 C 1320 240 1400 278 1480 256" opacity="0.18"/>
    <path d="M-40 280 C 230 224 390 322 590 292 C 810 260 950 338 1170 306 C 1330 282 1405 320 1480 298" opacity="0.15"/>
    <path d="M-40 324 C 240 268 400 366 600 336 C 820 304 960 380 1180 348 C 1340 324 1410 362 1480 340" opacity="0.12"/>
    <path d="M-40 368 C 250 312 410 410 610 380 C 830 348 970 422 1190 390 C 1350 366 1415 404 1480 382" opacity="0.09"/>
  </g>

  <!-- Scattered bean marks along the ridge line -->
  <g fill="#8a6a2a" opacity="0.20">
    <ellipse cx="228" cy="70" rx="7" ry="10" transform="rotate(-18 228 70)"/>
    <ellipse cx="642" cy="92" rx="6" ry="9" transform="rotate(12 642 92)"/>
    <ellipse cx="1046" cy="112" rx="7" ry="10" transform="rotate(-8 1046 112)"/>
    <ellipse cx="1332" cy="86" rx="6" ry="9" transform="rotate(22 1332 86)"/>
  </g>
</svg>
